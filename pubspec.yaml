name: repooor
description: "App de gestao de despensa domestica"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  intl: ^0.19.0
  mobile_scanner: ^6.0.7
  permission_handler: ^11.3.1
  skeletonizer: ^2.1.3
  http: ^1.2.2
  html: ^0.15.5
  xml: ^6.5.0
  fuzzywuzzy: ^1.2.0
  appwrite: ^25.3.0
  connectivity_plus: ^7.3.1

# url_launcher_android 6.3.31+ exige Dart ^3.12; o SDK de desenvolvimento deste
# projeto e o 3.10.1. Fixado na ultima versao que aceita 3.10.x.
dependency_overrides:
  url_launcher_android: 6.3.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.0+3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
